name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Derive version from tag
        id: version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}" # v1.0.0 -> 1.0.0
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        # testDebugUnitTest, not testReleaseUnitTest: these are plain JVM/Robolectric tests
        # that don't exercise anything release-specific (minification/signing is what
        # assembleRelease below covers) - the debug variant is also the only one that has the
        # Compose test-manifest activity entry (debugImplementation ui-test-manifest) that
        # DashboardScreenTest/HistoryScreenTest need Robolectric to resolve.
        #
        # A handful of ViewModel/Service tests have a known, unresolved intermittent flake
        # (real Room/DataStore I/O racing a test coroutine dispatcher - see CHANGELOG.md's
        # "Known issues"), not a regression signal. Retry once before failing the release.
        run: ./gradlew testDebugUnitTest || ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename APK for release
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Timer-${{ steps.version.outputs.name }}.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/Timer-${{ steps.version.outputs.name }}.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
