name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(sed -n 's/^timer.version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match timer.version=$version in gradle.properties"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.name }}"
            exit 1
          fi

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk "Timer-${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Timer ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          files: Timer-${{ steps.version.outputs.name }}.apk
